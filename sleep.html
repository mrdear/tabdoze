<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="sleep.css">
    <script src="sleep.js" defer></script>
</head>

<body>
    <main class="sleep-card">
        <span class="sleep-symbol" aria-hidden="true">☾</span>
        <p class="sleep-label">This tab is sleeping</p>
        <h1 id="pageTitle"></h1>
        <p class="sleep-description">Wake this tab to reload the page and continue browsing.</p>
        <button id="wakeTab" type="button" disabled>Wake tab</button>
    </main>
</body>

</html>
